<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FX VERSE</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05050a">
<link rel="preconnect" href="https://hwdnathczjelsdcsmoid.supabase.co" crossorigin><link rel="dns-prefetch" href="https://hwdnathczjelsdcsmoid.supabase.co"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050a;--sf:#0d0d15;--sf2:#151521;--gl:rgba(255,255,255,.045);--gl2:rgba(255,255,255,.085);--tx:#f6f5fb;--mu:#8d8ca3;--mu2:#5d5c72;--ac:#f43f5e;--ac2:#fb7185;--vi:#8b5cf6;--gd:#fbbf24;--ok:#34d399;--bd:rgba(255,255,255,.085);--bd2:rgba(255,255,255,.14);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);--io:cubic-bezier(.65,0,.35,1);--fd:'Sora','Inter',system-ui,sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--dockh:calc(92px + env(safe-area-inset-bottom));color-scheme:dark}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p{margin:0}
/* ambient aurora + film grain */
#fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#fx i{position:absolute;border-radius:50%;will-change:transform}
#fx i:nth-child(1){width:90vmax;height:90vmax;left:-40vmax;top:-48vmax;background:radial-gradient(circle,#e11d4846,transparent 64%);animation:d1 28s ease-in-out infinite alternate}
#fx i:nth-child(2){width:85vmax;height:85vmax;right:-42vmax;bottom:-46vmax;background:radial-gradient(circle,#7c3aed3d,transparent 64%);animation:d2 32s ease-in-out infinite alternate}
#fx i:nth-child(3){width:60vmax;height:60vmax;left:20vmax;top:30vh;background:radial-gradient(circle,#fb718512,transparent 66%);animation:d3 36s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(24vmax,18vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-22vmax,-16vmax) scale(1.12)}}
@keyframes d3{to{transform:translate(-14vmax,10vmax) scale(1.3)}}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{height:100%;position:relative;z-index:2;display:flex;flex-direction:column}
.scene{animation:scene .7s var(--out) both}
@keyframes scene{from{opacity:0;transform:scale(.985) translateY(8px)}}
.shell{flex:1;min-height:0;display:flex;flex-direction:column}
/* ---------- primitives ---------- */
button,input,textarea{font:inherit;color:inherit}
button{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gl);border:1px solid var(--bd);border-radius:14px;min-height:44px;padding:0 18px;cursor:pointer;font-weight:500;transition:transform .3s var(--spring),background .25s,border-color .25s,box-shadow .3s,opacity .2s,color .25s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button.pri{background:linear-gradient(135deg,#ff6b88,#f43f5e 48%,#be123c);border-color:transparent;font-weight:600;color:#fff;box-shadow:0 12px 30px -14px #f43f5e,inset 0 1px 0 #ffffff45}
button.ghost{background:linear-gradient(135deg,#f43f5e14,#8b5cf614);border-color:#f43f5e3a;color:#ffd4dc}
button.danger{color:#ff8da1}
button.wide{width:100%}
button.bare{background:none;border:0;border-radius:0;min-height:0;padding:0;overflow:visible;box-shadow:none}
@media(hover:hover){button:hover{border-color:var(--bd2);background:var(--gl2)}button.pri:hover{background:linear-gradient(135deg,#ff6b88,#f43f5e 48%,#be123c);box-shadow:0 16px 36px -12px #f43f5ee0,inset 0 1px 0 #ffffff55;transform:translateY(-1px)}button.bare:hover{background:none}button.ghost:hover{border-color:#f43f5e80}}
button.pri::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff40 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
@media(hover:hover){button.pri:hover::before{animation:sweep .9s var(--out)}}
@keyframes sweep{to{transform:translateX(120%)}}
button:active{transform:scale(.94)}button.bare:active{transform:none}
button:disabled{opacity:.45;cursor:default}
.rip{position:absolute;border-radius:50%;background:#ffffff33;transform:scale(0);animation:rip .65s var(--out) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.ib{width:44px;padding:0;border-radius:50%;flex:none}.ib.sm{width:36px;min-height:36px}
.ic{flex:none;display:block}.ic .t{fill:currentColor;opacity:.14;stroke:none}
input,textarea{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;width:100%;min-height:48px;transition:border-color .25s,box-shadow .3s,background .25s}
input::placeholder,textarea::placeholder{color:var(--mu2)}
input:focus,textarea:focus{outline:none;border-color:#f43f5e99;box-shadow:0 0 0 4px #f43f5e1f}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
.fld{display:flex;align-items:center;gap:11px;padding:0 15px;min-height:52px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--mu2);transition:border-color .25s,box-shadow .3s,background .25s,color .25s}
.fld:focus-within{border-color:#f43f5e99;background:#f43f5e0d;box-shadow:0 0 0 4px #f43f5e1f;color:var(--ac2)}
.fld input{background:none;border:0;padding:0;min-height:50px;border-radius:0;box-shadow:none;color:var(--tx);flex:1;min-width:0}
.muted,.hint{color:var(--mu);font-size:.85rem}.hint{font-size:.78rem;line-height:1.5}
.err{color:#ff8da1;min-height:1.3em;font-size:.88rem;text-align:center}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}
.sk{border-radius:10px;background:linear-gradient(100deg,#ffffff0a 30%,#ffffff1a 50%,#ffffff0a 70%) 0 0/250% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
/* ---------- brand mark ---------- */
.logo{display:block;filter:drop-shadow(0 6px 16px #f43f5e77);animation:float 5s ease-in-out infinite}
.logo .eyes{fill:#fff;opacity:.92;transform-origin:32px 35px;animation:blink 6s infinite}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.word{font-family:var(--fd);font-weight:800;letter-spacing:.3em;text-transform:uppercase;background:linear-gradient(90deg,#fff,#fb7185,#c4b5fd,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-300% 0}}
.boot{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.boot .logo{animation:float 3s ease-in-out infinite,pop .9s var(--spring) both}
.boot .word{font-size:.95rem}
.boot i{display:block;width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ac),transparent);background-size:200% 100%;animation:ld 1.1s linear infinite}
@keyframes ld{to{background-position:-200% 0}}
/* ---------- auth ---------- */
.auth{margin:auto;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px;padding:30px 22px 22px;border-radius:32px;background:linear-gradient(180deg,#ffffff0d,#ffffff04);border:1px solid var(--bd);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 50px 100px -40px #000,inset 0 1px 0 #ffffff14}
.auth>*{animation:rise .7s var(--out) both}
.auth>:nth-child(2){animation-delay:.05s}.auth>:nth-child(3){animation-delay:.1s}.auth>:nth-child(4){animation-delay:.15s}.auth>:nth-child(5){animation-delay:.2s}.auth>:nth-child(6){animation-delay:.25s}.auth>:nth-child(7){animation-delay:.3s}.auth>:nth-child(8){animation-delay:.35s}
.auth .hd{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:6px;text-align:center}
.auth .hd .word{font-size:1.05rem}.auth .hd p{color:var(--mu);font-size:.86rem}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--bd)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(135deg,#f43f5e33,#8b5cf633);border:1px solid #ffffff1c;transition:transform .55s var(--spring);transform:translateX(calc(var(--s,0)*100%))}
.seg button{background:none;border:0;min-height:40px;font-weight:600;font-size:.88rem;color:var(--mu);border-radius:12px;padding:0}.seg button.on{color:#fff}
@media(hover:hover){.seg button:hover{background:none;color:#fff}}
.cx{display:grid;grid-template-rows:0fr;opacity:0;margin:-6px 0;transition:grid-template-rows .5s var(--out),opacity .35s,margin .5s var(--out)}
.cx>div{overflow:hidden;min-height:0;padding:5px;margin:-5px}
.auth[data-m=up] .cx.up{grid-template-rows:1fr;opacity:1;margin:0}
.meter{display:none;grid-template-columns:repeat(5,1fr);gap:5px;height:4px;margin:-2px 2px 0}
.meter.on{display:grid;animation:fade .3s}
.auth .hint:empty,.auth .err:empty{display:none}.meter i{border-radius:2px;background:#ffffff14;transition:background .35s}
.meter i.f{background:var(--c,#f43f5e)}
.pend{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;margin:0 auto;color:var(--ac2);background:radial-gradient(circle,#f43f5e22,transparent 70%);position:relative}
.pend::before,.pend::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid #f43f5e66;animation:ping 2.4s var(--out) infinite}
.pend::after{animation-delay:1.2s}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
/* ---------- header ---------- */
header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;z-index:6}
header::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#05050af0,#05050a99);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid var(--bd)}
header .t{flex:1;min-width:0}
header b{display:block;font-family:var(--fd);font-weight:700;font-size:1.04rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:flex;align-items:center;color:var(--mu);font-size:.76rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px 6px 10px;border-radius:99px;background:linear-gradient(135deg,#fbbf2420,#f43f5e22);border:1px solid #fbbf2444;font-weight:700;font-size:.86rem;white-space:nowrap;animation:pop .6s var(--spring)}
.chip .ic{stroke:url(#gF);animation:flame 1.8s ease-in-out infinite;transform-origin:50% 90%}.chip .ic .t{fill:url(#gF);opacity:.35}
@keyframes flame{50%{transform:scale(1.14) rotate(-6deg)}}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:#666;transition:background .3s}
.dot.ok{background:#34d399;animation:pulse 2.2s infinite}.dot.re{background:#f59e0b}.dot.off{background:#ef4444}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39999}70%{box-shadow:0 0 0 7px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
#net{flex:none;max-height:0;overflow:hidden;text-align:center;font-size:.78rem;font-weight:600;color:#fcd34d;background:#f59e0b1c;transition:max-height .4s var(--out)}
#net.on{max-height:30px;padding:6px 0}#net.off{color:#fda4af;background:#ef44441c}
/* ---------- views + dock ---------- */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(36px) scale(.985);transition:opacity .4s var(--out),transform .65s var(--out),visibility 0s linear .65s}
.view[data-p=l]{transform:translateX(-36px) scale(.985)}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.vw>*{flex:none}
#v-chat{padding-bottom:var(--dockh)}
.vw{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px calc(var(--dockh) + 28px);width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.vw::-webkit-scrollbar{display:none}
.view.on.enter .vw>*{animation:rise .7s var(--out) both}
.view.on.enter .vw>:nth-child(2){animation-delay:.05s}.view.on.enter .vw>:nth-child(3){animation-delay:.1s}.view.on.enter .vw>:nth-child(4){animation-delay:.15s}.view.on.enter .vw>:nth-child(5){animation-delay:.2s}.view.on.enter .vw>:nth-child(6){animation-delay:.25s}.view.on.enter .vw>:nth-child(7){animation-delay:.3s}
#dock{position:fixed;z-index:20;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:28px;background:rgba(14,14,24,.66);-webkit-backdrop-filter:blur(28px) saturate(1.9);backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--bd2);box-shadow:0 28px 60px -18px #000,0 0 0 1px #00000040,inset 0 1px 0 #ffffff18;animation:dockin .9s var(--spring) .2s both}
@keyframes dockin{from{transform:translateY(90px);opacity:0}}
#dock .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:22px;background:linear-gradient(135deg,#f43f5e38,#8b5cf638);border:1px solid #ffffff1f;box-shadow:0 10px 26px -10px #f43f5e,inset 0 1px 0 #ffffff22;transform:translateX(calc(var(--i,0)*100%));transition:transform .65s var(--spring)}
.nv{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:.66rem;font-weight:600;letter-spacing:.03em;transition:color .3s}
.nv .ni{position:relative;display:block}
.nv .ic{transition:transform .55s var(--spring),stroke .3s;stroke:currentColor}
.nv.on{color:#fff}.nv.on .ic{transform:translateY(-1px) scale(1.14);stroke:url(#gA)}.nv.on .ic .t{fill:url(#gA);opacity:.34}
.nv:active .ic{transform:scale(.82)}
.bg{position:absolute;top:-6px;right:-10px;min-width:17px;height:17px;border-radius:9px;background:var(--ac);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #0e0e18,0 4px 10px -2px #f43f5e;animation:pop .5s var(--spring)}
.bg[hidden]{display:none}
/* ---------- chat ---------- */
#stories{flex:none;display:flex;gap:14px;overflow-x:auto;padding:12px max(16px,calc((100% - 780px)/2)) 12px;scrollbar-width:none;position:relative;z-index:3}
#stories::-webkit-scrollbar{display:none}
.st{flex:none;width:66px;text-align:center;font-size:.68rem;color:var(--mu);animation:pop .6s var(--spring) both}
.rg{width:64px;height:64px;border-radius:50%;padding:3px;display:grid;place-items:center;background:conic-gradient(from var(--a),hsl(var(--h,350) 95% 62%),hsl(calc(var(--h,350) + 70) 95% 62%),hsl(var(--h,350) 95% 62%));animation:ringspin 5s linear infinite}
@keyframes ringspin{to{--a:360deg}}
.rg button{width:100%;height:100%;border-radius:50%;padding:0;border:3px solid var(--bg);background:linear-gradient(135deg,hsl(var(--h,350) 55% 26%),hsl(var(--h,350) 55% 14%));font-family:var(--fd);font-weight:700;font-size:1.15rem;color:#fff;min-height:0}
.rg.add{background:none;border:1.5px dashed #ffffff3d;animation:none;padding:0}.rg.add button{border:0;background:#ffffff0a;color:var(--ac2)}
.st span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}
#lw{flex:1;min-height:0;position:relative}
#list{height:100%;overflow-y:auto;padding:8px max(14px,calc((100% - 780px)/2)) 14px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.day,.sys{align-self:center;color:var(--mu);font-size:.72rem;font-weight:600;letter-spacing:.04em;margin:10px 0}
.dg{display:flex;flex-direction:column;gap:2px}
.day{position:sticky;top:4px;z-index:2;background:rgba(14,14,24,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:4px 13px;border-radius:99px;border:1px solid var(--bd)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%;align-self:flex-start;transform-origin:0 100%}
.msg:not(.g){margin-top:9px}
.msg.mine{align-self:flex-end;transform-origin:100% 100%}
.msg.new{animation:min .55s var(--spring) both}
@keyframes min{from{opacity:0;transform:translateY(22px) scale(.85)}}
.mc{display:flex;flex-direction:column;min-width:0;align-items:flex-start}.mine .mc{align-items:flex-end}
.nm{font-size:.74rem;margin:0 0 4px 8px;font-weight:700;cursor:pointer;letter-spacing:.01em}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:.82rem;font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 72% 54%),hsl(calc(var(--h) + 40) 72% 32%));box-shadow:0 6px 16px -6px hsl(var(--h) 80% 50%),inset 0 1px 0 #ffffff40;cursor:pointer;transition:transform .3s var(--spring)}
.av:active{transform:scale(.86)}.av.sp{visibility:hidden}.av.big{width:76px;height:76px;font-size:1.9rem}
.bub{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 15px;border-radius:20px;border:1px solid #ffffff12;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;line-height:1.4;transition:transform .3s var(--spring),opacity .3s;box-shadow:0 10px 24px -16px #000}
.bub:active{transform:scale(.96)}
.msg:not(.mine).g .bub{border-top-left-radius:6px}.msg:not(.mine):not(.l) .bub{border-bottom-left-radius:6px}
.mine .bub{background:linear-gradient(135deg,#ff5f7e,#f43f5e 50%,#be123c);border-color:#ffffff22;color:#fff;box-shadow:0 12px 26px -14px #f43f5e,inset 0 1px 0 #ffffff40}
.mine.g .bub{border-top-right-radius:6px}.mine:not(.l) .bub{border-bottom-right-radius:6px}
.msg.pend .bub{opacity:.6}
.bub.pin{box-shadow:0 0 0 1.5px #fbbf2499,0 10px 24px -16px #000}
.bub.del{opacity:.5;font-style:italic;background:transparent;border:1px dashed var(--bd2);box-shadow:none}
.meta{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--mu);margin:4px 8px 0}.meta .ic{color:var(--gd)}
.rx{display:flex;gap:5px;flex-wrap:wrap;margin:4px 2px 0}.mine .rx{justify-content:flex-end}
.rx button{min-height:28px;padding:0 10px;border-radius:14px;font-size:.8rem;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.rx .me{border-color:#f43f5ecc;background:#f43f5e2e}
.rx .pop{animation:pop .5s var(--spring)}
.fl{position:fixed;z-index:70;font-size:1.7rem;pointer-events:none;animation:fl 1.05s var(--out) both}
@keyframes fl{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.empty{margin:auto;color:var(--mu);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px}
.empty .logo{opacity:.9}
#fabw{position:absolute;right:16px;bottom:10px;z-index:3;opacity:0;transform:translateY(14px) scale(.8);pointer-events:none;transition:opacity .25s,transform .45s var(--spring)}
#fabw.on{opacity:1;transform:none;pointer-events:auto}
#fab{width:44px;height:44px;padding:0;border-radius:50%;background:rgba(20,20,32,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 12px 28px -10px #000;overflow:visible}
#fabn{position:absolute;top:-7px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);font-size:.7rem;font-weight:800;display:none;place-items:center;padding:0 5px;animation:pop .4s var(--spring)}
#typ{flex:none;min-height:1.6em;display:flex;align-items:center;gap:8px;padding:0 20px;font-size:.76rem;color:var(--mu)}
.dots i{display:inline-block;width:5px;height:5px;margin:0 1.5px;border-radius:50%;background:var(--ac2);animation:bnc 1s infinite}

/* ---------- soul profile + center create control ---------- */
.nv-create{color:#fff!important}
.nv-create .ni{width:38px;height:38px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#fb7185,#a78bfa);box-shadow:0 7px 22px #f43f5e55,inset 0 1px 0 #ffffff70;animation:plusBreath 2.6s ease-in-out infinite;transition:transform .35s var(--spring),box-shadow .35s}
.nv-create .ic{stroke:#fff!important;transform:none!important;width:25px;height:25px}
.nv-create:active .ni{transform:rotate(90deg) scale(.9)}
@keyframes plusBreath{0%,100%{box-shadow:0 7px 22px #f43f5e44,inset 0 1px 0 #ffffff70}50%{box-shadow:0 8px 30px #a78bfa77,0 0 0 5px #f43f5e0c,inset 0 1px 0 #ffffff70}}
.soul-profile{display:flex;flex-direction:column;gap:16px}
.soul-profile-head{display:grid;grid-template-columns:100px 1fr;gap:18px;align-items:center;padding:18px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(145deg,#ffffff0b,#ffffff03)}
.soul-dp{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,350) 75% 28%),#171722);border:2px solid #ffffff24;box-shadow:0 0 0 4px #ffffff08,0 12px 32px #0006;color:#fff;font-size:1.7rem;font-weight:800;flex:none}

.soul-profile-meta{min-width:0}.soul-profile-meta h2{font-size:1.22rem;margin:0 0 3px}.soul-profile-meta .handle{color:var(--mu);font-size:.82rem}
.soul-profile-stats{display:flex;gap:clamp(12px,4vw,28px);margin-top:12px}
.soul-stat{border:0;background:transparent;padding:0;color:var(--tx);display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.soul-stat b{font-size:1rem;font-weight:800}.soul-stat span{font-size:.72rem;color:var(--mu)}
.soul-bio{grid-column:1/-1;color:var(--mu);font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:-4px}
.soul-profile-actions{display:flex;gap:8px;flex-wrap:wrap}.soul-profile-actions>*{flex:1}
.soul-grid-head{display:flex;align-items:center;justify-content:space-between;padding:3px 2px}
.soul-post-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.soul-grid-item{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:#11111a;border:1px solid var(--bd);padding:0}
.soul-grid-item img,.soul-grid-item video{width:100%;height:100%;object-fit:cover;display:block}
.soul-grid-item .grid-reel{position:absolute;right:7px;top:7px;background:#0009;border-radius:8px;padding:4px;display:grid;place-items:center}
.soul-grid-empty{grid-column:1/-1;padding:28px 18px;text-align:center;border:1px dashed var(--bd2);border-radius:18px;color:var(--mu)}
.soul-list{display:flex;flex-direction:column;gap:8px}.soul-person{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:16px}
